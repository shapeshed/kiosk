plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.shapeshed.kiosk'
    compileSdk 37
    ndkVersion = "28.2.13676358"

    def releaseKeystoreFile = System.getenv("KIOSK_KEYSTORE_FILE")
    def releaseKeystorePassword = System.getenv("KIOSK_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("KIOSK_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("KIOSK_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystoreFile &&
        releaseKeystorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

    defaultConfig {
        applicationId "com.shapeshed.kiosk"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha26'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    // Adaptive list-detail layout (not part of the Compose BOM — versioned separately).
    def adaptiveVersion = '1.3.0'
    implementation "androidx.compose.material3.adaptive:adaptive:$adaptiveVersion"
    implementation "androidx.compose.material3.adaptive:adaptive-layout:$adaptiveVersion"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation:$adaptiveVersion"

    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'io.coil-kt.coil3:coil-compose:3.5.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.5.0'
    implementation 'io.coil-kt.coil3:coil-svg:3.5.0'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'
    implementation 'org.jsoup:jsoup:1.23.1'
    def roomVersion = '2.8.4'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
